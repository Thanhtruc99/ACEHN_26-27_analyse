<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devine le Nombre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Jeu: Devine le Nombre</h1>
    <p>Devine un nombre entre 1 et 100</p>
    <input type="number" id="guessInput" placeholder="Entrez votre nombre" min="1" max="100">
    <button onclick="checkGuess()">Vérifier</button>
    <p id="message"></p>
    <button onclick="resetGame()">Nouvelle Partie</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
